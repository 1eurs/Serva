name: CI

# Runs the checks that nothing was running before: the backend test suite and a
# real frontend type-check + build. Note the production image is built with
# -DskipTests (see Dockerfile), so this workflow is the ONLY thing standing
# between a broken commit and a deploy.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run tests
        # Whole suite, CafeQrFlowIntegrationTest included — it spins up a real
        # Postgres via Testcontainers, which works out of the box on the runner.
        # (Locally on Docker 29 it needs -DargLine="-Dapi.version=1.44", because
        # docker-java negotiates below Docker 29's minimum API version of 1.44.
        # Deliberately not pinned here or in the pom: the runner's Docker is
        # older and negotiates fine, and hardcoding 1.44 would break anyone on a
        # Docker too old to speak it.)
        run: mvn -B test

      - name: Upload surefire reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check and build
        # `npm run build` is `tsc -b && vite build` — the same command
        # deploy-vps.sh runs, so a green job here means the deploy will build.
        run: npm run build
