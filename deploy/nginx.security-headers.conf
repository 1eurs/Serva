# Security response headers for serva.om.
#
# In a snippet because nginx's add_header does NOT merge: a location block with
# any add_header of its own drops every header inherited from the server block.
# serva.om has three such locations (/files/, =/index.html, ~^/assets/ all set
# Cache-Control), so these must be included in each of them as well as at the
# server level, or they would silently vanish on exactly the paths that serve
# the app's assets.
#
# 'always' so the headers are sent on error responses too, not just 2xx.

# The site is already HTTPS-only in practice — Cloudflare 301s port 80, and ufw
# only admits Cloudflare's ranges to the origin — so this states what is already
# true rather than changing behaviour.
add_header Strict-Transport-Security "max-age=31536000" always;

# Stop the browser guessing a content type it was not given. Matters most for
# /files/, which serves café-uploaded images: without it, a file crafted to
# sniff as HTML can execute as a document on this origin.
add_header X-Content-Type-Options "nosniff" always;

# Clickjacking. The dashboard performs authenticated actions with one click —
# accept an order, refund, revoke a member — and framing is how those get
# clicked by someone else's page. SAMEORIGIN rather than DENY, so anything the
# app itself frames keeps working.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;

# This one is not theoretical here. An SSE stream is opened with the ticket in
# the query string, because EventSource cannot set headers — and the default
# referrer behaviour would hand that full URL, ticket included, to any
# third-party resource the page loads. Sending only the origin cross-origin
# keeps the ticket out of other people's logs.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
