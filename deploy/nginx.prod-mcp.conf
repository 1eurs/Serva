    # The hosted MCP (cafeqr-mcp container, loopback 3001). Mirrors the /api/ proxy: stateless
    # JSON-RPC POSTs, each carrying its own serva_sk_ key. Buffering off and a long read timeout
    # so streamed tool responses aren't held back. This block is spliced into the serva.om server
    # block on the host (/etc/nginx/sites-available/serva.om); kept here so it lives in the repo.
    location /mcp {
        proxy_pass http://127.0.0.1:3001/mcp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 4M;
    }
