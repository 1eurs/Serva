# Staging's front door, inside a container.
#
# Production runs nginx on the host, terminates TLS with Certbot and admits only
# Cloudflare's ranges through ufw. None of that applies here: the Pi has no public IP and
# no host nginx, and the only way in is the Cloudflare tunnel, which terminates TLS at the
# edge and speaks plain HTTP to this port on loopback. So this file is the routing half of
# the production config and none of the TLS half.
#
# The routes themselves are deliberately identical to production. A staging box that
# serves the app on different paths, or caches differently, tests something that is not
# the thing you are about to deploy.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name staging.serva.om;

    root /usr/share/nginx/html;
    index index.html;

    # cloudflared hands us the visitor's address here. Without this every request looks
    # like it came from the tunnel, and rate limiting on the backend would see one client.
    set_real_ip_from 0.0.0.0/0;          # only the tunnel can reach this port
    real_ip_header CF-Connecting-IP;

    # Same headers as production. nginx's add_header does not merge, so any location
    # below that sets its own has to repeat them — hence the include in each.
    include /etc/nginx/security-headers.conf;

    # Staging must never be indexed. It is the same product on the same registered domain
    # as production, and a search engine that finds it will happily rank it against the
    # real site.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The tunnel already terminated TLS, so the app is behind https even though this
        # hop is not. Says so explicitly, or every absolute URL the backend builds comes
        # out http:// and the browser blocks it as mixed content.
        proxy_set_header X-Forwarded-Proto https;

        # Server-sent events: the live order stream must not be buffered or timed out.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 50M;
    }

    location /files/ {
        proxy_pass http://backend:8080/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        client_max_body_size 50M;
    }

    # Hashed filenames, so they can be cached forever.
    location ~* ^/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # The one file that must never be cached: it is what points at the hashed assets, so a
    # stale copy pins the whole app to a build you already replaced.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/security-headers.conf;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Client-side routing: every unknown path is the SPA's problem, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
